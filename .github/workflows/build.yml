name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:

env:
  DOCKERHUB_SLUG: crazymax/gopls-analyzers
  GHCR_SLUG: ghcr.io/crazy-max/gopls-analyzers
  DESTDIR: ./bin
  DOCKER_BUILD_SUMMARY: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      validate-includes: ${{ steps.validate.outputs.matrix }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Validate matrix
        id: validate
        uses: docker/bake-action/subaction/matrix@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          target: validate
          fields: platforms

  validate:
    runs-on: ubuntu-latest
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.validate-includes) }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Validate
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ matrix.target }}
          set: |
            *.platform=${{ matrix.platforms }}

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # same as global permissions
      id-token: write # required for Codecov OIDC
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Test
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: test
      -
        name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: ${{ env.DESTDIR }}/coverage
          use_oidc: true
          disable_file_fixes: true # needed for Go language https://docs.codecov.com/docs/fixing-reports

  artifacts:
    uses: docker/github-builder/.github/workflows/bake.yml@bb1eb9fb69408ac52395fb21f49c6b52d564529a # v1.20.0
    permissions:
      contents: read # same as global permission
      id-token: write # for signing attestation(s) with GitHub OIDC Token
    needs:
      - validate
    with:
      runner: ubuntu-latest
      target: artifact-all
      output: local
      artifact-name: gopls-analyzers
      artifact-upload: true
      sbom: true
      sign: ${{ github.event_name != 'pull_request' }}
      set: |
        *.args.GIT_FETCH_HISTORY=1

  artifacts-finalize:
    runs-on: ubuntu-latest
    needs:
      - artifacts
    steps:
      -
        name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.artifacts.outputs.artifact-name }}
          path: /tmp/buildx-output
      -
        name: Rename provenance and sbom
        run: |
          for pdir in /tmp/buildx-output/*/; do
            (
              cd "$pdir"
              binname=$(find . -name 'gopls-analyzers_*')
              filename=$(basename "$binname")
              filename=${filename%.exe}
              mv "provenance.json" "${filename}.provenance.json"
              mv "sbom-binary.spdx.json" "${filename}.sbom.json"
              find . -name 'sbom*.json' -exec rm {} \;
              if [ -f "provenance.sigstore.json" ]; then
                mv "provenance.sigstore.json" "${filename}.sigstore.json"
              fi
            )
          done
          mkdir -p "$DESTDIR"
          mv /tmp/buildx-output/**/* "$DESTDIR/"
      -
        name: List artifacts
        working-directory: ${{ env.DESTDIR }}
        run: |
          tree -nh .
      -
        name: Check artifacts
        working-directory: ${{ env.DESTDIR }}
        run: |
          find . -type f -exec file -e ascii -- {} +
      -
        name: Upload release binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ env.DESTDIR }}/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - artifacts-finalize
      - test
    permissions:
      contents: write # required to create GitHub release
    steps:
      -
        name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ env.DESTDIR }}/release
          name: release
      -
        name: GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: ${{ env.DESTDIR }}/release/*
          fail_on_unmatched_files: true

  image-prepare:
    runs-on: ubuntu-latest
    outputs:
      repo-slugs: |
        ${{ env.DOCKERHUB_SLUG }}
        ${{ env.GHCR_SLUG }}
    steps:
      # FIXME: can't use env object in reusable workflow inputs: https://github.com/orgs/community/discussions/26671
      - run: echo "Exposing env vars for reusable workflow"

  image:
    uses: docker/github-builder/.github/workflows/bake.yml@bb1eb9fb69408ac52395fb21f49c6b52d564529a # v1.20.0
    permissions:
      contents: read # same as global permission
      id-token: write # for signing attestation(s) with GitHub OIDC Token
      packages: write # required to push to GHCR
    needs:
      - image-prepare
      - artifacts-finalize
      - test
    with:
      runner: ubuntu-latest
      target: image-all
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      set-meta-labels: true
      meta-images: |
        ${{ needs.image-prepare.outputs.repo-slugs }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=ref,event=pr
        type=edge
      meta-labels: |
        org.opencontainers.image.title=gopls-analyzers
        org.opencontainers.image.description=Run gopls analyzers with a single go vet-compatible tool
        org.opencontainers.image.vendor=CrazyMax
      set: |
        *.args.GIT_FETCH_HISTORY=1
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
